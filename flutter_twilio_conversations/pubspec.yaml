name: flutter_twilio_conversations
description: Integrate the Twilio Conversations SDK with your Flutter app using this Twilio Conversations Flutter plugin
version: 2.1.0+20
repository: https://github.com/Diversido/flutter_twilio_conversations
issue_tracker: https://github.com/Diversido/flutter_twilio_conversations/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  # iOS requires the SwiftPM plugin build path with the generated FlutterFramework
  # package, which first shipped in stable Flutter 3.44.0. On older Flutter (or
  # with SwiftPM disabled) the build silently falls back to the frozen CocoaPods
  # podspec, which lacks the BK-6201 Twilsock crash fixes.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_twilio_conversations_platform_interface: ^2.0.9
  enum_to_string: ^2.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4

flutter:
  plugin:
    implements: flutter_twilio_conversations
    platforms:
      android:
        package: twilio.flutter.twilio_conversations
        pluginClass: TwilioConversationsPlugin
      ios:
        pluginClass: TwilioConversationsPlugin
      # web platform removed - implement web support separately if needed
